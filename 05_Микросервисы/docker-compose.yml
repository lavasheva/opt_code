name: refactoring-task3
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: student
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1 first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U student -d shop']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  migrate:
    build: ./service_users
    command: node migrate.js
    environment:
      DATABASE_URL: postgres://student:${POSTGRES_PASSWORD}@db:5432/shop
    depends_on:
      db: {condition: service_healthy}
  service_users:
    build: ./service_users
    environment:
      DATABASE_URL: postgres://student:${POSTGRES_PASSWORD}@db:5432/shop
    depends_on:
      migrate: {condition: service_completed_successfully}
  service_orders:
    build: ./service_orders
    environment:
      DATABASE_URL: postgres://student:${POSTGRES_PASSWORD}@db:5432/shop
    depends_on:
      migrate: {condition: service_completed_successfully}
  service_payment_methods:
    build: ./service_payment_methods
    environment:
      DATABASE_URL: postgres://student:${POSTGRES_PASSWORD}@db:5432/shop
      USERS_URL: http://service_users:8000
    depends_on:
      migrate: {condition: service_completed_successfully}
  api_gateway:
    build: ./api_gateway
    ports: ['8000:8000']
    environment:
      USERS_URL: http://service_users:8000
      ORDERS_URL: http://service_orders:8000
      PAYMENT_URL: http://service_payment_methods:8000
      REDIS_URL: redis://redis:6379
    depends_on: [service_users, service_orders, service_payment_methods, redis]
volumes:
  pgdata:
